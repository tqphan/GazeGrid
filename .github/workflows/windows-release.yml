name: Signed Windows MSI
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a draft GitHub release for the CMake version
        type: boolean
        default: true
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    environment: windows-release
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        shell: pwsh
        run: |
          $project = Get-Content CMakeLists.txt -Raw
          if ($project -notmatch 'project\(gaze-grid\s+VERSION\s+(\d+\.\d+\.\d+)') { throw 'Missing project version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$($Matches[1])") {
            throw 'The release tag must match the version in CMakeLists.txt.'
          }
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Restore pinned Tobii SDK headers (no runtime binaries)
        shell: pwsh
        env:
          GAZE_GRID_TOBII_HEADERS_BASE64: ${{ secrets.GAZE_GRID_TOBII_HEADERS_BASE64 }}
        run: ./platform/windows/Restore-TobiiSdk.ps1 -Destination "$env:RUNNER_TEMP/tobii-sdk"
      - name: Import persistent gaze-grid signing identity
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.GAZE_GRID_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.GAZE_GRID_SIGNING_PFX_PASSWORD }}
        run: |
          if (!$env:PFX_BASE64 -or !$env:PFX_PASSWORD) { throw 'Configure the gaze-grid signing secrets first.' }
          $path = "$env:RUNNER_TEMP/gaze-grid.pfx"
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
            $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $path -Password $password -CertStoreLocation Cert:\CurrentUser\My
            if ($cert.Subject -ne 'CN=gaze-grid' -or $cert.Issuer -ne $cert.Subject) { throw 'Expected self-signed CN=gaze-grid' }
            Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP/gaze-grid.cer" | Out-Null
            Import-Certificate -FilePath "$env:RUNNER_TEMP/gaze-grid.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            "SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
          } finally { Remove-Item $path -Force -ErrorAction SilentlyContinue }
          (Join-Path $env:WIX 'bin') | Out-File $env:GITHUB_PATH -Append
      - name: Build signed MSI
        shell: pwsh
        run: ./platform/windows/Build-Release.ps1 -CertificateThumbprint $env:SIGNING_THUMBPRINT -TobiiSdk "$env:RUNNER_TEMP/tobii-sdk"
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Verify MSI installation, signed application launch and uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/windows/*.msi | Select-Object -First 1).FullName
          ./platform/windows/Test-Installed.ps1 -Msi $msi -CertificateThumbprint $env:SIGNING_THUMBPRINT -ExpectTobii
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Prepare versioned release assets and checksums
        id: release
        shell: pwsh
        run: ./platform/windows/Prepare-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: gaze-grid-Windows-x64-signed
          path: build/windows/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: |
            build/windows/*-qt-test.txt
            build/windows/Testing/Temporary/LastTest.log
            build/windows/_CPack_Packages/win64/WIX/wix.log
            ${{ runner.temp }}/gaze-grid-msi-*.log
            ${{ runner.temp }}/gaze-grid-app-*
          if-no-files-found: ignore
      - name: Remove signing identity
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\Root\$env:SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }

  release:
    name: Create draft GitHub release
    needs: package
    if: github.event_name == 'push' || inputs.create_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: gaze-grid-Windows-x64-signed
          path: release
      - name: Attach verified assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          cd ..
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tagged_commit=$(git rev-list -n 1 "$RELEASE_TAG")
            test "$tagged_commit" = "$GITHUB_SHA" || { echo 'Existing version tag points to a different commit.'; exit 1; }
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-status.txt; then
            test "$(cat draft-status.txt)" = true || { echo 'Refusing to replace a published release.'; exit 1; }
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --notes-file release/RELEASE-NOTES.md
            gh release upload "$RELEASE_TAG" release/*.msi release/gaze-grid.cer release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release/*.msi release/gaze-grid.cer release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "gaze-grid $RELEASE_VERSION" --draft \
              --notes-file release/RELEASE-NOTES.md
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
