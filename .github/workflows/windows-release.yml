name: Signed Windows MSI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    environment: windows-release
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Import persistent GazeGrid signing identity
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.GAZEGRID_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.GAZEGRID_SIGNING_PFX_PASSWORD }}
        run: |
          if (!$env:PFX_BASE64 -or !$env:PFX_PASSWORD) { throw 'Configure the GazeGrid signing secrets first.' }
          $path = "$env:RUNNER_TEMP/GazeGrid.pfx"
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
            $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $path -Password $password -CertStoreLocation Cert:\CurrentUser\My
            if ($cert.Subject -ne 'CN=GazeGrid' -or $cert.Issuer -ne $cert.Subject) { throw 'Expected self-signed CN=GazeGrid' }
            Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP/GazeGrid.cer" | Out-Null
            Import-Certificate -FilePath "$env:RUNNER_TEMP/GazeGrid.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            "SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
          } finally { Remove-Item $path -Force -ErrorAction SilentlyContinue }
          (Join-Path $env:WIX 'bin') | Out-File $env:GITHUB_PATH -Append
      - name: Build signed MSI
        shell: pwsh
        run: ./platform/windows/Build-Release.ps1 -CertificateThumbprint $env:SIGNING_THUMBPRINT
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Verify MSI installation, signed application launch and uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/windows/*.msi | Select-Object -First 1).FullName
          ./platform/windows/Test-Installed.ps1 -Msi $msi -CertificateThumbprint $env:SIGNING_THUMBPRINT
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - uses: actions/upload-artifact@v4
        with:
          name: GazeGrid-Windows-x64-signed
          path: |
            build/windows/*.msi
            build/windows/GazeGrid.cer
          if-no-files-found: error
      - name: Remove signing identity
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGNING_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\Root\$env:SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
