<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>GazeGrid</title>
  <desc>A lavender eye surrounding a square keyboard key on a purple tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#713cf4"/>
      <stop offset="1" stop-color="#29116c"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f6eaff"/>
      <stop offset="1" stop-color="#b892f5"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5e5ff"/>
      <stop offset="0.45" stop-color="#d0abfa"/>
      <stop offset="1" stop-color="#b583ee"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <g fill="url(#eye)">
